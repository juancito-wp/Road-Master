$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@roadmaster.com",
      "password": "Admin123!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login correcto', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.set('token', pm.response.json().token);
      pm.collectionVariables.set('usuario_id', pm.response.json().usuario.id);
    language: text/javascript
order: 1000
